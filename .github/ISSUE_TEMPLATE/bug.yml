name: Bug report
description: Something in ghostmode went wrong.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you saw.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The ghostmode version from your Cargo.lock.
    validations:
      required: true
