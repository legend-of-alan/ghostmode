[package]
name = "ghostmode"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Code Mode for Rust agents. The model writes a Python script that calls your tools, and ghostmode runs it in a sandbox."
license = "MIT"
repository = "https://github.com/legend-of-alan/ghostmode"
readme = "README.md"
keywords = ["agent", "llm", "code-mode", "sandbox", "python"]
categories = ["development-tools", "asynchronous"]
exclude = [".github", "AGENTS.md", "assets", "rust-toolchain.toml"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
futures-timer = "3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hmac = "0.13"
monty = { version = "=1.6.0", optional = true }
monty-pool = { version = "=1.6.0", optional = true }
monty-types = { version = "=1.6.0", optional = true }
rmcp = { version = "3.11", default-features = false, features = ["client"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tracing = { version = "0.1", default-features = false, features = ["std"] }

[features]
default = ["monty"]
# Runs scripts in Monty inside the caller's process, as `backend::Monty`.
monty = ["dep:monty", "dep:monty-types"]
# Runs each session's scripts in a Monty worker process from a monty-pool `Pool`, as
# `backend::MontyPool`.
monty-pool = ["dep:monty-pool", "dep:monty-types"]
# Offers a connected MCP server's tools to scripts as `mcp::Server`.
rmcp = ["dep:rmcp"]

[dev-dependencies]
cucumber = "0.23"
futures = "0.3"
rmcp = { version = "3.11", default-features = false, features = ["client", "server"] }
tokio = { version = "1", features = ["io-util", "rt", "rt-multi-thread"] }
tracing-subscriber = "0.3"

[[test]]
name = "features"
path = "tests/features.rs"
harness = false
required-features = ["monty"]

# CI builds with -D warnings, so these fail the build.
[lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
