[package]
name = "ghostmode"
version = "0.0.1"
edition = "2024"
description = "Code Mode for Rust agents: sandboxed execute and poll tools for agentic REPL loops."
license = "MIT"
repository = "https://github.com/legend-of-alan/ghostmode"
readme = "README.md"

[dependencies]
futures-timer = "3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
monty = "=1.6.0"
monty-types = "=1.6.0"
rmcp = { version = "3.11", default-features = false, features = ["client"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = { version = "0.1", default-features = false, features = ["std"] }

[features]
# Offers a connected MCP server's tools to scripts as `mcp::Server`.
rmcp = ["dep:rmcp"]

[dev-dependencies]
cucumber = "=0.23.0"
futures = "0.3"
rmcp = { version = "3.11", default-features = false, features = ["client", "server"] }
tokio = { version = "1", features = ["io-util", "rt", "rt-multi-thread"] }
tracing-subscriber = "0.3"

[[test]]
name = "features"
path = "tests/features.rs"
harness = false

# CI builds with -D warnings, so these fail the build.
[lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
